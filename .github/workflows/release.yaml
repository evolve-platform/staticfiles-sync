name: Create release

on:
  workflow_dispatch:

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser publishes the GitHub release
    outputs:
      tag: ${{ steps.latest.outputs.output }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Get the latest version
        id: latest
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: latest
          args: latest

      - name: Add env vars
        run: |
          echo GORELEASER_CURRENT_TAG=${{ steps.latest.outputs.output }}>> $GITHUB_ENV
          echo RELEASE_NOTES_PATH=.changes/${{ steps.latest.outputs.output }}.md >> $GITHUB_ENV

      - name: Create release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: --clean --release-notes=${{ env.RELEASE_NOTES_PATH }} --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ env.GORELEASER_CURRENT_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPATH: ${{ env.GOPATH }}

      - name: Upload release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staticfiles-sync
          path: dist/*

  # Scan the released binary, not go.mod: buildinfo lists only the modules that
  # are linked in, so test and tool deps stay out. No checkout, no DT secret.
  sbom:
    needs: goreleaser
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staticfiles-sync
          path: dist

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      # SPDX for the release page, CycloneDX 1.6 for DependencyTrack.
      - name: Generate SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_FILE_METADATA_SELECTION: none
          TAG: ${{ needs.goreleaser.outputs.tag }}
        run: |
          set -euo pipefail
          BIN=$(find dist -type f -path '*linux_amd64*' -name 'staticfiles-sync_v*' | head -n 1)
          if [ -z "${BIN}" ]; then
            echo "::error::linux_amd64 binary not found in dist"
            exit 1
          fi
          "$SYFT" "file:${BIN}" \
            --source-name staticfiles-sync \
            --source-version "$TAG" \
            -o spdx-json=staticfiles-sync.spdx.json \
            -o cyclonedx-json@1.6=staticfiles-sync.cdx.json

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.goreleaser.outputs.tag }}
        run: gh release upload "$TAG" staticfiles-sync.spdx.json staticfiles-sync.cdx.json --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: staticfiles-sync.cdx.json
          retention-days: 7

  # Separate job so the DT key is never present while other repo code runs.
  dependencytrack:
    needs: [goreleaser, sbom]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx

      # Each release becomes a version under the "oss/go/staticfiles-sync"
      # library container (OSS > OSS Go), which rolls up the latest version.
      - name: Upload SBOM to DependencyTrack
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_OSS_APIKEY }}
          DT_URL: https://dependencytrack-api.labdigital.nl:8443
          PROJECT: oss/go/staticfiles-sync
          TAG: ${{ needs.goreleaser.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DT_API_KEY}" ]; then
            echo "::error::DEPENDENCYTRACK_OSS_APIKEY is not available to this repo"
            exit 1
          fi
          curl -sS --fail-with-body -X POST "${DT_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DT_API_KEY}" \
            -F "autoCreate=true" \
            -F "projectName=${PROJECT}" \
            -F "projectVersion=${TAG}" \
            -F "parentName=${PROJECT}" \
            -F "isLatest=true" \
            -F "bom=@staticfiles-sync.cdx.json"
